let db=loadDB(),view='home',category='Tous',selected=null,adminTab='orders',lastGeneratedCode='';
function loadDB(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)return{...x,products:x.products?.length?x.products:DEFAULT_PRODUCTS,orders:x.orders||[],cart:x.cart||[],settings:{phone:'237683674166',pin:'2468',business:'Éclat d’Afrique',...(x.settings||{})}}}catch(e){}return{products:DEFAULT_PRODUCTS,orders:[],cart:[],settings:{phone:'237683674166',pin:'2468',business:'Éclat d’Afrique'}}}

function money(n){return Number(n||0).toLocaleString('fr-FR')+' FCFA'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function scene(p){let c=COL[p.cat]||['#38bdf8','#1e3a8a'],b='';for(let i=0;i<7;i++)b+=`<i style="left:${8+i*13}%;width:${8+(i*5)%12}px;height:${8+(i*5)%12}px;animation-delay:${(i*.65).toFixed(1)}s"></i>`;return `<div class="scene" style="--c1:${c[0]};--c2:${c[1]}">${b}<b class="sp" style="left:14%;top:16%">✦</b><b class="sp" style="right:16%;top:28%;animation-delay:.8s">✦</b><span class="em">${esc(p.emoji||'🧺')}</span><svg viewBox="0 0 100 40" preserveAspectRatio="none"><path d="M0 40V22Q14 8 30 20T62 16T100 8V40Z" fill="#ffffff30"/><path d="M0 40V30Q22 20 44 28T100 22V40Z" fill="#0000002a"/></svg></div>`}
function img(p){return p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:scene(p)}
function card(p){return `<article class="card" onclick="openProduct('${p.id}')"><div class="photo">${img(p)}<span class="tag">${esc(p.cat)}</span>${p.domicile?'<span class="badge">🚐 Domicile</span>':''}${p.promo?'<span class="promo">FORFAIT</span>':''}${p.video?'<div class="video-badge">▶ Vidéo</div>':''}</div><div class="cardbody"><h4>${esc(p.name)}</h4><div class="desc">${esc(p.desc)}</div><div class="price">${money(p.price)} <small style="font-size:9px;color:var(--muted)">${esc(p.unit)}</small></div><div class="rowbtn"><button class="smallbtn" onclick="event.stopPropagation();openProduct('${p.id}')">Détails</button><button class="smallbtn primary" onclick="event.stopPropagation();addCart('${p.id}')">Ajouter</button></div></div></article>`}
function section(t,l){return `<section class="section"><div class="sectionhead"><h3>${t}</h3><span>${l.length} offre(s)</span></div><div class="grid">${l.map(card).join('')||'<p class="muted">Offres bientôt disponibles.</p>'}</div></section>`}
function homeHTML(){return `<div class="hero"><strong>Le pressing de Bafoussam qui prend soin de tes habits.</strong><p>Pressing soigné pour tes vêtements. Nettoyage à domicile pour canapés, matelas et tapis, dans tous les quartiers.</p><button onclick="showView('catalog')">Voir tous les tarifs</button></div><div class="domicile" onclick="openProduct('D002')"><div class="icon">🛋️</div><div><h3>Canapé & Matelas à domicile</h3><p>Nous convenons avec vous d’un rendez-vous à Bafoussam.</p><button>Découvrir le service</button></div></div><div class="b2b" onclick="showView('pro')"><div><h3>🏨 Hôtels & Restaurants</h3><p>Draps, nappes, serviettes et linge professionnel.</p></div><button>Demander un devis</button></div>${section('🔥 Forfaits économiques',db.products.filter(p=>p.cat==='Forfaits'))}${section('🧽 Nettoyage à domicile',db.products.filter(p=>p.domicile))}${section('👕 Pressing & vêtements',db.products.filter(p=>p.cat==='Au Déballage'))}<div class="foot">Éclat d’Afrique Pressing · Près du Stade Municipal · Bafoussam</div>`}
function catalogHTML(){let cats=['Tous',...new Set(db.products.map(p=>p.cat))];return `<div class="field" style="padding:12px 15px 0"><input id="search" placeholder="🔎 Rechercher un service…" oninput="filterProducts()"></div><div class="chips">${cats.map(c=>`<button class="chip ${category===c?'active':''}" onclick="setCategory('${esc(c)}')">${esc(c)}</button>`).join('')}</div><section class="section"><div class="sectionhead"><h3>Catalogue & tarifs</h3></div><div class="grid" id="productGrid">${db.products.filter(p=>category==='Tous'||p.cat===category).map(card).join('')}</div></section>`}

function addCart(id){let p=db.products.find(x=>x.id===id);if(!p)return;let x=db.cart.find(y=>y.id===id);if(x)x.qty++;else db.cart.push({id,qty:1});save();toast('Ajouté au panier 🛒')}
function askProduct(id){let p=db.products.find(x=>x.id===id);wa(`Bonjour Éclat d’Afrique, je souhaite des informations sur ${p.name} (${money(p.price)} ${p.unit}).`)}
function cartHTML(){if(!db.cart.length)return `<div class="view empty"><div style="font-size:48px">🛒</div><h3>Ton panier est vide</h3><p>Choisis une prestation ou un forfait.</p><button class="primarybtn" onclick="showView('catalog')">Voir les tarifs</button></div>`;let total=0,home=db.cart.some(x=>db.products.find(p=>p.id===x.id)?.domicile);let rows=db.cart.map(x=>{let p=db.products.find(y=>y.id===x.id);if(!p)return'';total+=p.price*x.qty;return `<div class="itemline"><div><b>${esc(p.name)}</b><br><small class="muted">${money(p.price)} × ${x.qty}</small></div><div><b>${money(p.price*x.qty)}</b><br><button class="smallbtn" onclick="changeQty('${p.id}',-1)">−</button> <button class="smallbtn" onclick="changeQty('${p.id}',1)">+</button></div></div>`}).join('');return `<div class="view"><h2>Mon panier</h2>${rows}<div class="itemline"><b>Total indicatif</b><b style="color:var(--b)">${money(total)}</b></div><div class="notice ${home?'blue':''}">${home?'🚐 Indiquez votre quartier et votre adresse pour demander un rendez-vous à domicile.':'Le délai et le montant définitif sont confirmés par le pressing.'}</div><h3>Vos coordonnées</h3><div class="field"><label>Nom complet</label><input id="custName" placeholder="Votre nom"></div><div class="field"><label>Téléphone WhatsApp</label><input id="custPhone" inputmode="tel" placeholder="6XXXXXXXX"></div><div class="field"><label>Quartier</label><input id="custArea" list="qtz" placeholder="Ex. Tamdja, Djeleng…"><datalist id="qtz"><option>Tamdja</option><option>Djeleng</option><option>Banengo</option><option>Kamkop</option><option>Tougang</option><option>Famla</option><option>Marché A</option><option>Centre-ville</option></datalist></div><div class="field"><label>Paiement prévu</label><select id="custPay"><option>Espèces</option><option>MTN Mobile Money</option><option>Orange Money</option></select></div><div class="field"><label>${home?'Adresse précise':'Précisions'}</label><textarea id="custNote" rows="3" placeholder="Votre besoin…"></textarea></div><button class="primarybtn" onclick="checkout()">Valider et générer mon code</button><button class="secondarybtn" onclick="db.cart=[];save();render()">Vider le panier</button></div>`}
function changeQty(id,d){let x=db.cart.find(y=>y.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)db.cart=db.cart.filter(y=>y.id!==id);save();render()}
function nextCode(){let y=new Date().getFullYear(),s=db.orders.filter(o=>String(o.code).startsWith('ECL-'+y+'-')).length+1,c;do{c=`ECL-${y}-${String(s++).padStart(4,'0')}`}while(db.orders.some(o=>o.code===c));return c}
function checkout(){let name=custName.value.trim(),phone=custPhone.value.trim(),area=custArea.value.trim(),note=custNote.value.trim(),pay=custPay.value;if(!name||!phone){alert('Nom et téléphone obligatoires.');return}
let total=db.cart.reduce((s,x)=>s+(db.products.find(p=>p.id===x.id)?.price||0)*x.qty,0),lines=db.cart.map(x=>{let p=db.products.find(y=>y.id===x.id);return p?`${p.name} (x${x.qty})`:''}).filter(Boolean).join(', '),hasHome=db.cart.some(x=>db.products.find(p=>p.id===x.id)?.domicile),code=nextCode();
db.orders.push({code,name,phone,items:lines,total,paid:0,status:STEPS[0],date:new Date().toLocaleDateString('fr-FR'),address:area,note,pay});save();try{localStorage.setItem('eclat_last_code',code)}catch(e){}lastGeneratedCode=code;
let msg=`Bonjour Éclat d’Afrique Pressing !\n\n*NOUVELLE COMMANDE : ${code}*\nNom : ${name}\nTel : ${phone}\nQuartier : ${area}\nPaiement : ${pay}\n\nArticles : ${lines}\nTotal : ${money(total)}\n`+(hasHome?`🚐 *Intervention à domicile* (Note : ${note})\n`:`Note : ${note}\n`)+`\nMerci de confirmer la réception.`;

function successHTML(){return `<div class="success-screen"><div class="success-icon">🎉</div><h2 style="color:var(--green);margin-top:15px">Commande enregistrée !</h2><p class="muted">Voici votre code de suivi unique.<br>Gardez-le précieusement.</p><div class="code-box"><p style="font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:0">Votre code</p><h1>${lastGeneratedCode}</h1><button class="copy-btn" onclick="copyCode()">📋 Copier le code</button></div><button class="primarybtn" onclick="showView('track');document.getElementById('trackCode').value='${lastGeneratedCode}';trackOrder()">📦 Suivre ma commande</button><button class="secondarybtn" onclick="showView('home')">Retour à l’accueil</button><div class="notice success">Le pressing reçoit votre demande sur WhatsApp et va confirmer votre commande.</div></div>`}

function trackHTML(){let c='';try{c=localStorage.getItem('eclat_last_code')||''}catch(e){}return `<div class="view"><h2>Suivi de commande</h2><p class="muted">Saisissez le code remis lors du dépôt.</p><div class="field"><label>Code de suivi</label><input id="trackCode" placeholder="ECL-2026-0001" style="text-transform:uppercase" value="${esc(c)}"></div><button class="primarybtn" onclick="trackOrder()">Voir l’avancement</button><div id="trackResult"></div><div class="notice">Le suivi s’affiche depuis le téléphone où la commande a été enregistrée. Si vous avez perdu votre code, écrivez-nous sur WhatsApp.</div></div>`}
function trackOrder(){let code=document.getElementById('trackCode').value.trim().toUpperCase(),o=db.orders.find(x=>String(x.code).toUpperCase()===code),box=document.getElementById('trackResult');if(!o){box.innerHTML='<div class="notice danger">Code introuvable. Vérifiez votre ticket.</div>';return}let idx=STEPS.indexOf(o.status);box.innerHTML=`<div class="order"><div class="orderhead"><b>${esc(o.code)}</b><span class="pill">${esc(o.status)}</span></div><p>Client : ${esc(o.name)} · ${esc(o.date)}</p><p>Articles : ${esc(o.items)}</p><div class="timeline">${STEPS.map((s,i)=>`<div class="step ${i<=idx?'done':''}">${i<=idx?'✓':'○'} ${s}</div>`).join('')}</div></div>`}
function proHTML(){return `<div class="view"><h2>Service professionnel</h2><p class="muted">Blanchisserie pour hôtels, restaurants, résidences et établissements de Bafoussam.</p><div class="hero" style="margin:15px 0"><strong style="font-size:19px">Votre linge professionnel, traité avec méthode.</strong><p>Tri, lavage, séchage, repassage et contrôle selon le volume convenu.</p></div><div class="notice">Devis selon quantités, fréquence, délais et collecte/livraison.</div><h3>Demander un devis</h3><div class="field"><label>Nom de l’établissement</label><input id="proName"></div><div class="field"><label>Responsable / téléphone</label><input id="proContact"></div><div class="field"><label>Quartier</label><input id="proArea"></div><div class="field"><label>Service</label><select id="proType"><option>Draps et linge de lit</option><option>Nappes et serviettes</option><option>Uniformes du personnel</option><option>Nettoyage canapés / matelas</option><option>Offre mixte</option></select></div><div class="field"><label>Volume et fréquence</label><textarea id="proQty" rows="3" placeholder="Ex. 20 draps trois fois par semaine"></textarea></div><button class="primarybtn" onclick="sendPro()">Demander mon devis sur WhatsApp</button></div>`}
function sendPro(){let name=proName.value.trim(),area=proArea.value.trim();if(!name||!area){alert('Nom établissement et quartier obligatoires.');return}wa(`Bonjour Éclat d’Afrique Pressing. Demande de devis professionnel.\nÉtablissement : ${name}\nResponsable : ${proContact.value}\nQuartier : ${area}\nService : ${proType.value}\nVolume/fréquence : ${proQty.value}`)}
function adminHTML(){return `<div class="view"><div class="adminhead"><h2 style="margin:0">Espace responsable</h2><small>Gestion Éclat d’Afrique</small></div><div id="adminContent">${adminLoginOrPanel()}</div></div>`}
function adminLoginOrPanel(){let ok=false;try{ok=sessionStorage.getItem('eclatAdmin')}catch(e){}return ok?adminPanel():`<p class="muted">Accès réservé au responsable.</p><div class="field"><label>Code PIN</label><input id="adminPin" type="password" inputmode="numeric"></div><button class="primarybtn" onclick="loginAdmin()">Ouvrir la gestion</button>`}

function adminPanel(){let o=db.orders,ready=o.filter(x=>x.status==='Prêt').length,active=o.filter(x=>x.status!=='Récupéré').length;return `<div class="stats"><div class="stat"><strong>${o.length}</strong><small>Commandes</small></div><div class="stat"><strong>${active}</strong><small>En cours</small></div><div class="stat"><strong>${ready}</strong><small>Prêtes</small></div><div class="stat"><strong>${money(o.reduce((s,x)=>s+Math.max(0,(x.total||0)-(x.paid||0)),0))}</strong><small>À encaisser</small></div></div><div class="subnav"><button onclick="adminTab='orders';render()" class="${adminTab==='orders'?'active':''}">Commandes</button><button onclick="adminTab='new';render()" class="${adminTab==='new'?'active':''}">+ Nouvelle</button><button onclick="adminTab='products';render()" class="${adminTab==='products'?'active':''}">Catalogue</button><button onclick="adminTab='settings';render()" class="${adminTab==='settings'?'active':''}">Paramètres</button></div>${adminTab==='orders'?ordersHTML():adminTab==='new'?newOrderHTML():adminTab==='products'?productsHTML():settingsHTML()}<button class="secondarybtn" onclick="backup()">Sauvegarder JSON</button><button class="secondarybtn" onclick="logoutAdmin()">Fermer la session</button>`}
function ordersHTML(){if(!db.orders.length)return'<div class="empty">Aucune commande enregistrée.</div>';return [...db.orders].reverse().map(o=>`<div class="order"><div class="orderhead"><div><h4>${esc(o.code)} · ${esc(o.name)}</h4><p>${esc(o.date)} · ${esc(o.phone)}${o.pay?' · '+esc(o.pay):''}</p></div><span class="pill">${esc(o.status)}</span></div><p>${esc(o.items)}</p><p><b>${money(o.total)}</b> · Payé ${money(o.paid)} · Reste ${money(Math.max(0,(o.total||0)-(o.paid||0)))}</p><div class="field"><label>Étape</label><select onchange="updateOrder('${o.code}','status',this.value)">${STEPS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Montant encaissé</label><input type="number" value="${o.paid||0}" onchange="updateOrder('${o.code}','paid',this.value)"></div><div class="rowbtn"><button class="smallbtn primary" onclick="shareStatus('${o.code}')">Informer WhatsApp</button><button class="smallbtn" onclick="deleteOrder('${o.code}')">Supprimer</button></div></div>`).join('')}
function updateOrder(c,k,v){let o=db.orders.find(x=>x.code===c);if(o){o[k]=k==='paid'?Math.max(0,+v||0):v;save();toast('Commande mise à jour');render()}}function deleteOrder(c){if(confirm('Supprimer cette commande ?')){db.orders=db.orders.filter(o=>o.code!==c);save();render()}}function shareStatus(c){let o=db.orders.find(x=>x.code===c);if(o)wa(`Bonjour ${o.name}, votre commande ${o.code} est actuellement : ${o.status}. Merci pour votre confiance.`)}
function newOrderHTML(){return `<h3>Nouvelle commande</h3><div class="field"><label>Nom client *</label><input id="oName"></div><div class="field"><label>Téléphone *</label><input id="oPhone"></div><div class="field"><label>Articles *</label><textarea id="oItems"></textarea></div><div class="field"><label>Total estimé FCFA</label><input id="oTotal" type="number" value="0"></div><div class="field"><label>Déjà encaissé</label><input id="oPaid" type="number" value="0"></div><button class="primarybtn" onclick="createOrder()">Créer le ticket</button>`}

function pickImg(inp,id){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/jpeg',.72);if(id==='new'){window._pImg=u;toast('Photo prête ✓ — ajoutez le service')}else{let p=db.products.find(x=>x.id===id);if(p){p.image=u;save();render();toast('Photo enregistrée ✓')}}};im.onerror=()=>alert('Image illisible.');im.src=r.result};r.readAsDataURL(f)}
function setVideo(id){let p=db.products.find(x=>x.id===id);if(!p)return;let v=prompt('Collez le lien de la vidéo (laisser vide pour retirer) :',p.video||'');if(v===null)return;p.video=v.trim();save();render()}
function addProduct(){if(!pName.value.trim()){alert('Nom obligatoire');return}db.products.push({id:'X'+Date.now(),name:pName.value.trim(),cat:pCat.value,price:+pPrice.value||0,unit:pUnit.value,desc:pDesc.value,emoji:pEmoji.value||'🧺',image:window._pImg||'',video:pVideo.value.trim(),domicile:pHome.checked});window._pImg=null;save();render();toast('Service ajouté')}
function delProduct(id){if(confirm('Retirer cet article ?')){db.products=db.products.filter(p=>p.id!==id);db.cart=db.cart.filter(x=>x.id!==id);save();render()}}
function settingsHTML(){return `<h3>Paramètres</h3><div class="field"><label>Nom commercial</label><input id="sBusiness" value="${esc(db.settings.business)}"></div><div class="field"><label>WhatsApp sans +</label><input id="sPhone" value="${esc(db.settings.phone)}"></div><div class="field"><label>Nouveau PIN</label><input id="sPin" value="${esc(db.settings.pin)}"></div><button class="primarybtn" onclick="saveSettings()">Enregistrer</button><div class="notice">Format Cameroun : 2376XXXXXXXX. Changez le PIN par défaut.</div>`}
function saveSettings(){db.settings.business=sBusiness.value.trim();db.settings.phone=sPhone.value.replace(/\D/g,'');db.settings.pin=sPin.value.trim()||'2468';save();toast('Paramètres enregistrés');render()}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='eclat-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function wa(m){window.open('https://wa.me/'+db.settings.phone+'?text='+encodeURIComponent(m),'_blank')}
function toast(s){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=s;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),1800)}
function toggleChat(){document.getElementById('chat-window').classList.toggle('open');let d=document.querySelector('#chat-bubble .dot');if(d)d.style.display='none'}
const nz=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function localAI(q){let t=nz(q),has=(...w)=>w.some(x=>t.includes(x));
if(has('bonjour','salut','bonsoir','hello'))return 'Bonjour ! 😊 Demande-moi un prix (costume, canapé, matelas…), le paiement, le délai ou l’adresse.';
if(has('momo','orange money','paiement','payer','espece'))return 'Tu peux payer en espèces, MTN Mobile Money ou Orange Money. Le montant final est confirmé au dépôt.';
if(has('adresse','ou etes','ou se trouve','stade','localisation','situe'))return 'Nous sommes à Bafoussam, près du Stade Municipal. 📍';
if(has('delai','combien de temps','quand'))return 'Le délai dépend de la charge et du textile : il est confirmé au dépôt. Tu suis l’avancement avec ton code de suivi.';
if(has('hotel','restaurant','pro ','professionnel'))return 'Pour les hôtels et restaurants, ouvre l’onglet 🏨 Hôtels : on te fait un devis selon le volume.';
let w=t.split(/[^a-z0-9]+/).filter(x=>x.length>2),best=null,sc=0;db.products.forEach(p=>{let h=nz(p.name+' '+p.cat),s=w.filter(x=>h.includes(x)).length;if(s>sc){sc=s;best=p}});
if(best)return `<b>${esc(best.name)}</b> : ${money(best.price)} ${esc(best.unit)}.<br>${esc(best.desc)}<br><button class="smallbtn primary" style="margin-top:8px" onclick="addCart('${best.id}')">Ajouter au panier</button>`;
return 'Je n’ai pas trouvé ce service. Écris-nous sur WhatsApp, on te répond vite ! 💬'}
function quickAsk(q){document.getElementById('chat-input').value=q;sendMessageToAI()}
let chatN=0;function addMsg(s,h){let c=document.getElementById('chat-messages'),d=document.createElement('div');d.className='message '+s;d.innerHTML=h;d.id='m'+chatN++;c.appendChild(d);c.scrollTop=c.scrollHeight;return d.id}
function sendMessageToAI(){let i=document.getElementById('chat-input'),m=i.value.trim();if(!m)return;addMsg('user',esc(m));i.value='';let id=addMsg('ai','<div class="typing"><span></span><span></span><span></span></div>');setTimeout(()=>{let e=document.getElementById(id);if(e){e.innerHTML=localAI(m);let c=document.getElementById('chat-messages');c.scrollTop=c.scrollHeight}},550)}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.classList.add('show')});
async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();const{outcome}=await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').classList.remove('show');toast(outcome==='accepted'?'Installation lancée ✓':'Installation annulée')}
window.addEventListener('appinstalled',()=>{deferredPrompt=null;document.getElementById('installBtn').classList.remove('show');toast('App installée ! 🎉')});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(()=>console.log('[PWA] SW enregistré')).catch(e=>console.log('[PWA] SW erreur',e))})}
render();cartCount();
</script></body></html>
